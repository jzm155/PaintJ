<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vector Studio</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">V</span><strong>Vector Studio</strong></div>
    <nav class="menu">
      <button data-menu="Arquivo">Arquivo</button><button data-menu="Editar">Editar</button>
      <button data-menu="Visualizar">Visualizar</button><button data-menu="Ajuda">Ajuda</button>
    </nav>
    <div class="top-actions">
      <button id="undoBtn" title="Desfazer (Ctrl+Z)">↶</button>
      <button id="redoBtn" title="Refazer (Ctrl+Y)">↷</button>
      <button class="primary" id="exportBtn">Exportar SVG</button>
    </div>
  </header>

  <main class="workspace">
    <aside class="tools-panel">
      <div class="tool-group">
        <div class="tool-group-title">FERRAMENTAS</div>
        <div class="tool-grid">
          <button class="tool active" data-tool="select" title="Mover camada (V)" aria-label="Mover camada (V)"><svg viewBox="0 0 24 24"><path d="M5 3 19 12 12 13 9 20 5 3Z"/><path d="m12 13 5 5"/></svg></button>
          <button class="tool" data-tool="pencil" title="Lápis (P)" aria-label="Lápis (P)"><svg viewBox="0 0 24 24"><path d="m12 20 8-8a2.8 2.8 0 0 0-4-4l-8 8-1 5 5-1Z"/><path d="m14 6 4 4"/></svg></button>
          <button class="tool" data-tool="brush" title="Pincel (B)" aria-label="Pincel (B)"><svg viewBox="0 0 24 24"><path d="m14 5 5 5"/><path d="m4 20 3.5-.5L19 8a2.8 2.8 0 0 0-4-4L3.5 16.5 4 20Z"/><path d="M4 20c0-3 2-5 5-5"/></svg></button>
          <button class="tool" data-tool="eraser" title="Borracha (E)" aria-label="Borracha (E)"><svg viewBox="0 0 24 24"><path d="m7 21-4-4a2 2 0 0 1 0-3L13 4a2 2 0 0 1 3 0l5 5a2 2 0 0 1 0 3l-9 9H7Z"/><path d="m8 10 7 7M14 21h7"/></svg></button>
          <button class="tool" data-tool="eyedropper" title="Conta-gotas (I)" aria-label="Conta-gotas (I)"><svg viewBox="0 0 24 24"><path d="m2 22 1-5 11-11 4 4L7 21l-5 1Z"/><path d="m14 6 4 4M16 4l2-2 4 4-2 2"/></svg></button>
          <button class="tool" data-tool="bucket" title="Balde de tinta (G)" aria-label="Balde de tinta (G)"><svg viewBox="0 0 24 24"><path d="m4 11 7-7 9 9-7 7-9-9Z"/><path d="m8 7 9 9M3 21h10"/><path d="M19 16c0 2 3 2 3 4a2 2 0 0 1-4 0c0-1 1-2 1-4Z"/></svg></button>
          <button class="tool" data-tool="text" title="Texto (X)" aria-label="Texto (X)"><svg viewBox="0 0 24 24"><path d="M4 5h16M12 5v14M8 19h8"/></svg></button>
          <div class="shape-tool-wrap">
            <button class="tool shape-picker" id="shapePickerButton" type="button" aria-expanded="false" title="Formas — Linha selecionada" aria-label="Abrir formas"><svg id="shapePickerIcon" viewBox="0 0 24 24"><path d="M4 20 20 4"/></svg></button>
            <div class="tool-grid shape-tools" id="shapeTools" hidden>
              <button class="tool" data-tool="line" title="Linha" aria-label="Linha"><svg viewBox="0 0 24 24"><path d="M5 19 19 5"/></svg></button>
              <button class="tool" data-tool="rect" title="Retângulo" aria-label="Retângulo"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/></svg></button>
              <button class="tool" data-tool="ellipse" title="Elipse" aria-label="Elipse"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg></button>
              <button class="tool" data-tool="triangle" title="Triângulo" aria-label="Triângulo"><svg viewBox="0 0 24 24"><path d="m12 4 9 16H3L12 4Z"/></svg></button>
            </div>
          </div>
        </div>
      </div>
      <div class="tool-hint">VECTOR STUDIO</div>
    </aside>

    <section class="editor">
      <div class="optionsbar">
        <span id="toolName">Selecionar</span>
        <label>Cor <input type="color" id="colorInput" value="#8b5cf6"></label>
        <label>Contorno <input type="color" id="strokeInput" value="#252538"></label>
        <label>Espessura <input type="number" id="strokeWidth" min="1" max="80" value="4"></label>
        <label>Preenchimento <input type="checkbox" id="fillToggle" checked></label>
        <span class="spacer"></span>
        <button id="zoomOut" title="Diminuir zoom">−</button><span id="zoomLabel" title="Zoom atual">100%</span><button id="zoomIn" title="Aumentar zoom">+</button>
        <button id="fitBtn" title="Voltar ao zoom de 100%">Ajustar</button>
      </div>
      <div class="canvas-wrap" id="canvasWrap">
        <div class="canvas-board">
          <svg id="artboard" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Área de desenho">
            <rect id="pageBackground" x="0" y="0" width="1200" height="750" fill="#ffffff" pointer-events="none"/>
            <g id="objectsRoot"></g>
            <g id="selectionRoot"></g>
          </svg>
        </div>
      </div>
      <footer class="statusbar"><span id="statusText">Pronto</span><span>Documento: 1200 × 750 px</span></footer>
    </section>

    <aside class="right-panel">
      <section class="panel-section layers-section">
        <div class="panel-tabs"><span class="panel-tab active">Camadas</span><span class="panel-tab">Propriedades</span></div>
        <div class="layers-toolbar">
          <span class="layer-filter-label">Camadas</span>
          <div class="layer-toolbar-actions">
            <button id="addLayerBtn" class="icon-btn" title="Nova camada" aria-label="Nova camada">＋</button>
            <button id="duplicateLayerBtn" class="icon-btn" title="Duplicar camada" aria-label="Duplicar camada">▢</button>
            <button id="deleteLayerBtn" class="icon-btn danger" title="Excluir camada" aria-label="Excluir camada">▤</button>
          </div>
        </div>
        <div class="layer-options"><span>Normal</span><span>Opacidade <strong>100%</strong></span></div>
        <div id="layersList" class="layers-list"></div>
        <div class="layer-actions">
          <button id="renameLayerBtn">Renomear</button>
          <button id="raiseLayerBtn" title="Mover camada para cima">↑</button>
          <button id="lowerLayerBtn" title="Mover camada para baixo">↓</button>
        </div>
      </section>
      <section class="panel-section properties">
        <div class="panel-title">Propriedades</div>
        <div id="propertyContent" class="muted">Selecione uma camada para ver suas propriedades.</div>
      </section>
      <section class="panel-section document-section">
        <div class="panel-title">Documento</div>
        <div class="doc-info"><span>Formato</span><strong>SVG</strong></div>
        <div class="doc-info"><span>Objetos</span><strong id="objectCount">0</strong></div>
        <div class="doc-info"><span>Camadas</span><strong id="layerCount">1</strong></div>
      </section>
    </aside>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
